# Scheduled data refresh: fetch -> process -> export -> validate, commit site/data, deploy.
# See docs/deploy.md.
name: Refresh data

on:
  schedule:
    # Weekdays at 09:05 and 13:05 Madrid time, all year. Cron is UTC and Madrid is UTC+1 in
    # winter and UTC+2 in summer, so each time is scheduled at both UTC hours and the `gate`
    # job lets through only the run that falls in the right Madrid hour.
    # 09:05: INE and Banco de España releases of 09:00.
    # 13:05: Eurostat (11:00) and the previous day's market closes.
    - cron: "5 7,8 * * 1-5"
    - cron: "5 11,12 * * 1-5"
  workflow_dispatch:

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          hour=$(TZ=Europe/Madrid date +%H)
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$hour" = "09" ] || [ "$hour" = "13" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Madrid time $(TZ=Europe/Madrid date +%H:%M): not a refresh slot (09:05 / 13:05), skipping."
          fi

  refresh:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # data/ is gitignored. Keeping it between runs lets a source whose API is down
      # fall back to its last download instead of failing the whole refresh.
      - name: Restore previous downloads
        uses: actions/cache@v4
        with:
          path: data
          key: pipeline-data-${{ github.run_id }}
          restore-keys: pipeline-data-

      # Exit 0 = all fresh; 3 = published, but some sources served from a previous
      # download (see the run log); anything else = failure, nothing is committed.
      - name: Run pipeline (fetch, process, export, validate)
        id: pipeline
        run: |
          set +e
          python run_pipeline.py
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ] && [ "$code" -ne 3 ]; then exit "$code"; fi

      - name: Validation report
        if: always()
        run: |
          {
            echo '## Contract validation'
            echo '```'
            python scripts/validate_contract.py || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit site/data if it changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes."
          else
            git commit -m "Data refresh $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail the run if some sources were not refreshed
        if: steps.pipeline.outputs.code == '3'
        run: |
          echo "::error::Some sources could not be refreshed; their data come from a previous download. See the pipeline step log."
          cat data/.fetch_failures.jsonl || true
          exit 1

  # Pushes made with GITHUB_TOKEN do not trigger other workflows, so deploy here.
  deploy:
    needs: refresh
    # always(): publish what did refresh even when the run is marked failed for stale sources.
    if: always() && needs.refresh.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
