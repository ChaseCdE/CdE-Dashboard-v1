# Scheduled data refresh: fetch -> process -> export -> validate, commit site/data, deploy.
# See docs/deploy.md.
name: Refresh data

on:
  schedule:
    # Weekdays 12:23 UTC (13:23 Madrid in winter, 14:23 in summer): after INE (09:00)
    # and Eurostat (11:00) releases and after the previous day's market closes.
    - cron: "23 12 * * 1-5"
  workflow_dispatch:

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # Headless browser for the AEAT Observatorio de Márgenes Empresariales (src/fetchers/aeat_ome.py)
          python -m playwright install --with-deps chromium-headless-shell

      # data/ is gitignored. Keeping it between runs lets a source whose API is down
      # fall back to its last download instead of failing the whole refresh.
      - name: Restore previous downloads
        uses: actions/cache@v4
        with:
          path: data
          key: pipeline-data-${{ github.run_id }}
          restore-keys: pipeline-data-

      # Exit 0 = all fresh; 3 = published, but some sources served from a previous
      # download (see the run log); anything else = failure, nothing is committed.
      - name: Run pipeline (fetch, process, export, validate)
        id: pipeline
        run: |
          set +e
          python run_pipeline.py
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ] && [ "$code" -ne 3 ]; then exit "$code"; fi

      - name: Validation report
        if: always()
        run: |
          {
            echo '## Contract validation'
            echo '```'
            python scripts/validate_contract.py || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit site/data if it changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes."
          else
            git commit -m "Data refresh $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail the run if some sources were not refreshed
        if: steps.pipeline.outputs.code == '3'
        run: |
          echo "::error::Some sources could not be refreshed; their data come from a previous download. See the pipeline step log."
          cat data/.fetch_failures.jsonl || true
          exit 1

  # Pushes made with GITHUB_TOKEN do not trigger other workflows, so deploy here.
  deploy:
    needs: refresh
    # always(): publish what did refresh even when the run is marked failed for stale sources.
    if: always() && needs.refresh.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
