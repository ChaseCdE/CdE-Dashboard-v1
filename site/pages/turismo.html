<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Turismo · La economía en datos</title>
  <meta name="description" content="Llegadas y gasto de turistas internacionales, pernoctaciones hoteleras, precios hoteleros e ingresos por turismo.">
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body>
  <header id="site-header" class="site-header"></header>
  <main>
    <div class="page-head">
      <h1>Turismo</h1>
      <p class="lead">Llegadas y gasto de los turistas internacionales (FRONTUR y EGATUR), pernoctaciones y precios hoteleros, e ingresos por turismo en la balanza de pagos.</p>
    </div>

    <h2>Indicadores clave</h2>
    <div id="kpis"></div>

    <h2>Turistas internacionales</h2>
    <div class="grid grid-2">
      <div id="arrivals"></div>
      <div id="spending"></div>
    </div>

    <h2>Alojamiento</h2>
    <div class="grid grid-2">
      <div id="stays"></div>
      <div id="hotel-prices"></div>
    </div>

    <h2>Balanza de pagos</h2>
    <div id="receipts"></div>
  </main>
  <footer id="site-footer" class="site-footer"></footer>
  <script type="module" src="../assets/js/pages/turismo.js"></script>
</body>
</html>
