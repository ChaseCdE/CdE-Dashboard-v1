<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mercados · La economía en datos</title>
  <meta name="description" content="Bolsas, divisas, materias primas y deuda del Tesoro de EE. UU.: evolución, rentabilidades y tablas de cotizaciones.">
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body>
  <header id="site-header" class="site-header"></header>
  <main>
    <div class="page-head">
      <h1>Mercados</h1>
      <p class="lead">Bolsas, divisas, materias primas y deuda del Tesoro de EE. UU. Datos diarios de mercado, con la rentabilidad en el último día, mes, año natural y último año.</p>
    </div>

    <h2>Indicadores clave</h2>
    <div id="kpis"></div>

    <h2>Bolsas</h2>
    <div class="grid grid-2">
      <div id="indices"></div>
      <div id="comparativa"></div>
    </div>
    <div class="grid grid-2">
      <div id="ytd"></div>
      <div id="bancos"></div>
    </div>
    <div class="grid">
      <div id="t-cotizaciones"></div>
    </div>
    <div class="grid">
      <div id="vix"></div>
    </div>

    <h2>Tipos de interés</h2>
    <div class="grid grid-2">
      <div id="t-tipos-eur"></div>
      <div id="t-tipos-us"></div>
    </div>
    <div class="grid">
      <div id="tesoro-us"></div>
    </div>

    <h2>Divisas</h2>
    <div class="grid grid-2">
      <div id="eurusd"></div>
      <div id="dxy"></div>
    </div>
    <div class="grid">
      <div id="t-divisas"></div>
    </div>

    <h2>Materias primas</h2>
    <div class="grid grid-2">
      <div id="petroleo"></div>
      <div id="oro"></div>
    </div>
    <div class="grid">
      <div id="gas"></div>
    </div>
    <div class="grid">
      <div id="t-materias"></div>
    </div>
  </main>
  <footer id="site-footer" class="site-footer"></footer>
  <script type="module" src="../assets/js/pages/mercados.js"></script>
</body>
</html>
