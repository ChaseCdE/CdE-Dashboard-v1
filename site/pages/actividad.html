<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Actividad · La economía en datos</title>
  <meta name="description" content="Crecimiento, demanda, productividad, producción, confianza empresarial, consumo, ahorro de los hogares y vivienda en España.">
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body>
  <header id="site-header" class="site-header"></header>
  <main>
    <div class="page-head">
      <h1>Actividad</h1>
      <p class="lead">Crecimiento del PIB y sus componentes de demanda, productividad, producción industrial y de servicios, confianza empresarial, consumo, ahorro de los hogares y vivienda.</p>
    </div>

    <h2>Indicadores clave</h2>
    <div id="kpis"></div>

    <h2>Producto interior bruto</h2>
    <div class="grid grid-2">
      <div id="gdp"></div>
      <div id="demand"></div>
      <div id="gdp-compare"></div>
      <div id="productivity"></div>
    </div>

    <h2>Producción y confianza empresarial</h2>
    <div class="grid grid-2">
      <div id="production"></div>
      <div id="turnover"></div>
      <div id="ipi-sectors"></div>
      <div id="ipss-sectors"></div>
      <div id="confidence"></div>
    </div>

    <h2>Consumo, hogares y vivienda</h2>
    <div class="grid grid-2">
      <div id="retail"></div>
      <div id="consumer-conf"></div>
      <div id="house-prices"></div>
      <div id="credit"></div>
      <div id="mortgage"></div>
      <div id="saving"></div>
      <div id="housing"></div>
      <div id="mortgages"></div>
    </div>
  </main>
  <footer id="site-footer" class="site-footer"></footer>
  <script type="module" src="../assets/js/pages/actividad.js"></script>
</body>
</html>
