<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sector público · La economía en datos</title>
  <meta name="description" content="Deuda y déficit de las Administraciones Públicas y coste de su financiación: rentabilidades, prima de riesgo e intereses.">
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body>
  <header id="site-header" class="site-header"></header>
  <main>
    <div class="page-head">
      <h1>Sector público</h1>
      <p class="lead">Deuda y déficit de las Administraciones Públicas, comparados con la UE-27, y coste de su financiación: rentabilidad de la deuda, prima de riesgo y gasto en intereses.</p>
    </div>

    <h2 id="indicadores-clave">Indicadores clave</h2>
    <div id="kpis"></div>

    <h2 id="deuda">Deuda</h2>
    <div class="grid grid-2">
      <div id="debt-gdp"></div>
      <div id="pde"></div>
    </div>

    <h2 id="deficit">Déficit</h2>
    <div class="grid grid-2">
      <div id="deficit-q"></div>
      <div id="deficit-a"></div>
    </div>

    <h2 id="coste-de-la-financiacion">Coste de la financiación</h2>
    <div class="grid grid-2">
      <div id="bonds"></div>
      <div id="spreads"></div>
    </div>
    <div id="interest"></div>
  </main>
  <footer id="site-footer" class="site-footer"></footer>
  <script type="module" src="../assets/js/pages/publico.js"></script>
</body>
</html>
