<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crédito y tipos · La economía en datos</title>
  <meta name="description" content="Tipos de interés del mercado monetario y bancarios, curva de rentabilidad de la deuda española, crédito, endeudamiento y sector exterior.">
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body>
  <header id="site-header" class="site-header"></header>
  <main>
    <div class="page-head">
      <h1>Crédito y tipos</h1>
      <p class="lead">Tipos de interés del mercado monetario y de la banca, rentabilidad de la deuda pública, crédito al sector privado, endeudamiento y sector exterior de la economía española.</p>
    </div>

    <h2>Indicadores clave</h2>
    <div id="kpis"></div>

    <h2>Tipos de interés</h2>
    <div class="grid grid-2">
      <div id="money"></div>
      <div id="lending"></div>
    </div>

    <h2>Deuda pública</h2>
    <div class="grid grid-2">
      <div id="curve"></div>
      <div id="bonds"></div>
      <div id="spreads"></div>
      <div id="pde"></div>
      <div id="deficit"></div>
      <div id="interest"></div>
    </div>

    <h2>Crédito y endeudamiento</h2>
    <div class="grid grid-2">
      <div id="credit"></div>
      <div id="debt"></div>
      <div id="newhh"></div>
      <div id="newcorp"></div>
      <div id="npl"></div>
    </div>

    <h2>Sector exterior</h2>
    <div class="grid grid-2">
      <div id="ca"></div>
      <div id="tourism"></div>
    </div>
  </main>
  <footer id="site-footer" class="site-footer"></footer>
  <script type="module" src="../assets/js/pages/credito.js"></script>
</body>
</html>
