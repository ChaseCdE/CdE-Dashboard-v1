<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Construcción y vivienda · La economía en datos</title>
  <meta name="description" content="Producción de la construcción, precios de la vivienda (INE, MIVAU, Registradores, Eurostat), alquiler, compraventas e hipotecas.">
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body>
  <header id="site-header" class="site-header"></header>
  <main>
    <div class="page-head">
      <h1>Construcción y vivienda</h1>
      <p class="lead">Actividad constructora, precios de la vivienda según el INE, el Ministerio de Vivienda, los Registradores y Eurostat, alquiler, compraventas e hipotecas.</p>
    </div>

    <h2 id="indicadores-clave">Indicadores clave</h2>
    <div id="kpis"></div>

    <h2 id="actividad-constructora">Actividad constructora</h2>
    <div class="grid grid-2">
      <div id="ipco"></div>
      <div id="construction-eu"></div>
    </div>
    <div id="gva"></div>

    <h2 id="precios-de-la-vivienda">Precios de la vivienda</h2>
    <div class="grid grid-2">
      <div id="house"></div>
      <div id="house-sources"></div>
    </div>
    <div class="grid grid-2">
      <div id="house-m2"></div>
      <div id="house-eu"></div>
    </div>
    <div id="house-rent"></div>

    <h2 id="compraventas-e-hipotecas">Compraventas e hipotecas</h2>
    <div class="grid grid-2">
      <div id="housing"></div>
      <div id="mortgages"></div>
    </div>
    <div class="grid grid-2">
      <div id="mortgage-rate"></div>
      <div id="new-loans"></div>
    </div>
  </main>
  <footer id="site-footer" class="site-footer"></footer>
  <script type="module" src="../assets/js/pages/construccion.js"></script>
</body>
</html>
