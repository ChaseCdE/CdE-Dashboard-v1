<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mercado laboral · La economía en datos</title>
  <meta name="description" content="Empleo, paro, participación y población, y costes laborales en España.">
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body>
  <header id="site-header" class="site-header"></header>
  <main>
    <div class="page-head">
      <h1>Mercado laboral</h1>
      <p class="lead">Empleo (afiliación y EPA), paro (EPA y registrado), participación y población, y costes laborales, con la comparación con la UE-27.</p>
    </div>

    <h2 id="indicadores-clave">Indicadores clave</h2>
    <div id="kpis"></div>

    <h2 id="empleo">Empleo</h2>
    <div class="grid grid-2">
      <div id="c-afil"></div>
      <div id="c-afil-var"></div>
    </div>
    <div class="grid grid-2">
      <div id="c-ocup"></div>
      <div id="c-sectores"></div>
    </div>
    <div class="grid grid-2">
      <div id="c-emp-eu"></div>
      <div id="c-vacantes"></div>
    </div>
    <div id="c-temp"></div>

    <h2 id="paro">Paro</h2>
    <div class="grid grid-2">
      <div id="c-paro"></div>
      <div id="c-paro-eu"></div>
    </div>
    <div class="grid grid-2">
      <div id="c-pr"></div>
      <div id="c-pr-var"></div>
    </div>
    <div class="grid grid-2">
      <div id="c-juvenil"></div>
      <div id="c-larga"></div>
    </div>

    <h2 id="participacion-y-poblacion">Participación y población</h2>
    <div class="grid grid-2">
      <div id="c-tasas"></div>
      <div id="c-actividad-eu"></div>
    </div>
    <div class="grid grid-2">
      <div id="c-tabla"></div>
      <div id="c-pob"></div>
    </div>

    <h2 id="costes-laborales">Costes laborales</h2>
    <div class="grid grid-2">
      <div id="c-coste"></div>
      <div id="c-hora"></div>
    </div>
    <div id="c-indice"></div>
  </main>
  <footer id="site-footer" class="site-footer"></footer>
  <script type="module" src="../assets/js/pages/laboral.js"></script>
</body>
</html>
